spring:
  application:
    name: devjarvis-backend

  datasource:
    url: jdbc:postgresql://192.168.0.10:31433/devjarvis
    username: devjarvis
    password: "${DEVJARVIS_DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
