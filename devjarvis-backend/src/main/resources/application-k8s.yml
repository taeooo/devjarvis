spring:
  application:
    name: devjarvis-backend

  datasource:
    url: jdbc:postgresql://devjarvis-postgres:5432/devjarvis
    username: devjarvis
    password: "${DEVJARVIS_DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  sql:
    init:
      mode: never

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

devjarvis:
  ai-server:
    base-url: http://devjarvis-ai-server:8000
    timeout-millis: 3000

  security:
    cors:
      allowed-origins:
        - http://localhost:1420
        - http://127.0.0.1:1420
        - http://tauri.localhost
        - https://tauri.localhost
        - tauri://localhost
  rate-limit:
    enabled: true
    write-requests-per-minute: 60
    manifest-requests-per-minute: 10
    screen-ocr-requests-per-minute: 12
    screen-analysis-requests-per-minute: 12
    max-tracked-clients: 10000

  screen:
    ocr:
      enabled: true
      max-image-bytes: 1500000
      max-width: 4096
      max-height: 4096
      preview-characters: 700
      allowed-mime-types:
        - image/jpeg
        - image/png
        - image/webp
    analysis:
      enabled: true
      max-ocr-text-characters: 12000
      preview-characters: 900
      allowed-intents:
        - screen_translate
        - screen_summary
        - screen_error_analysis
