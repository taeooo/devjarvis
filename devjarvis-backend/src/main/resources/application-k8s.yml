spring:
  application:
    name: devjarvis-backend

  datasource:
    url: jdbc:postgresql://devjarvis-postgres:5432/devjarvis
    username: devjarvis
    password: "${DEVJARVIS_DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  sql:
    init:
      mode: never

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

devjarvis:
  ai-server:
    base-url: http://devjarvis-ai-server:8000
    timeout-millis: 3000
